packages:
  - "dashboard"
  - "."
allowBuilds:
  '@firebase/util': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
overrides:
  websocket-driver: "^0.7.5"
  undici: "^7.25.0"
  brace-expansion: "^2.1.4"
  ip-address: "^10.3.1"
  protobufjs: "^7.6.5"
  form-data: "^2.5.6"
  "@grpc/grpc-js": "^1.14.4"
  uuid: "11.1.1"
  qs: "^6.15.2"
  "@babel/core": "^7.29.6"
  body-parser: "^1.20.6"
  # Override fast-uri to ^3.1.6 to resolve high-severity SSRF/Host confusion
  # vulnerability in @modelcontextprotocol/sdk -> ajv subdependency (CVE-2025-27758).
  # Note: This is a temporary workaround until the upstream dependency
  # (@modelcontextprotocol/sdk) is updated to use a patched version of ajv.
  fast-uri: "^3.1.6"
