version: 2
updates:
  # One pnpm workspace lockfile covers the platform and dashboard.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "giauphan"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      typescript:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
      routine-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
          - "@modelcontextprotocol/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci-deps)"
