name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancelled runs never reach the cache-save post step, so main must run to
  # completion to repopulate the caches that PR runs restore from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (Root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck Root
        run: pnpm run typecheck

      - name: Build Main Server
        run: pnpm run build

      - name: Typecheck Dashboard
        working-directory: dashboard
        run: pnpm run typecheck

      - name: Build Dashboard
        working-directory: dashboard
        run: pnpm run build

      - name: Run analyzer tests
        working-directory: ./
        run: pnpm test

      - name: Run dashboard tests
        working-directory: dashboard
        run: pnpm test

      - name: Install production dependencies only
        run: pnpm install --frozen-lockfile --prod

      - name: Verify production SQLite and vector startup
        env:
          CODEATLAS_DB_TYPE: sqlite
          CODEATLAS_SQLITE_PATH: ':memory:'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createDatabaseAdapter } from './dist/src/database/factory.js';
          const db = createDatabaseAdapter();
          try {
            await db.connect();
            await db.initializeSchema();
            const rows = await db.query('SELECT vec_version() AS version');
            assert.equal(typeof rows[0]?.version, 'string');
          } finally {
            await db.disconnect();
          }
          NODE

  sqlite:
    name: SQLite + sqlite-vec
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CODEATLAS_DB_TYPE: sqlite
      CODEATLAS_SQLITE_PATH: ${{ github.workspace }}/.tmp/codeatlas-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild SQLite native binding
        run: pnpm rebuild better-sqlite3

      - name: Typecheck Root
        run: pnpm run typecheck

      - name: Initialize and seed SQLite
        run: |
          mkdir -p "$(dirname "$CODEATLAS_SQLITE_PATH")"
          pnpm run db-seed

      - name: Run SQLite tests
        run: pnpm test

  context-hygiene:
    name: Context Hygiene Gate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Strict gate: the retrieval inject-gate must reject the known
      # context-polluting corpus and keep genuine engineering memories. Run in
      # isolation so a weakened blocklist fails the pipeline visibly.
      - name: Verify inject-gate blocklist corpus
        run: node --experimental-test-module-mocks --import tsx --test 'tests/unit/context-hygiene.test.ts'

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: pnpm audit (prod deps only)
        run: pnpm audit --prod --audit-level=high

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
