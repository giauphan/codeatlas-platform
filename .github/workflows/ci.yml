name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Oracle Instant Client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libaio1t64 unzip || sudo apt-get install -y -q libaio1 unzip
          mkdir -p /opt/oracle
          curl -sL "https://download.oracle.com/otn_software/linux/instantclient/1919000/instantclient-basic-linux.x64-19.19.0.0.0dbru.zip" -o /tmp/ic.zip
          unzip -q /tmp/ic.zip -d /opt/oracle/
          echo "/opt/oracle/instantclient_19_19" | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig
          rm /tmp/ic.zip

      - name: Install dependencies (Root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck Root
        run: pnpm run typecheck

      - name: Build Main Server
        run: pnpm run build

      - name: Typecheck Dashboard
        working-directory: dashboard
        run: pnpm run typecheck

      - name: Build Dashboard
        working-directory: dashboard
        run: pnpm run build

      - name: Run analyzer tests
        working-directory: ./
        run: pnpm test

      - name: Run dashboard tests
        working-directory: dashboard
        run: pnpm test

  sqlite:
    name: SQLite + sqlite-vec
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CODEATLAS_DB_TYPE: sqlite
      CODEATLAS_SQLITE_PATH: ${{ github.workspace }}/.tmp/codeatlas-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild SQLite native binding
        run: pnpm rebuild better-sqlite3

      - name: Typecheck Root
        run: pnpm run typecheck

      - name: Initialize and seed SQLite
        run: |
          mkdir -p "$(dirname "$CODEATLAS_SQLITE_PATH")"
          pnpm run db-seed

      - name: Run SQLite tests
        run: pnpm test

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: pnpm audit (prod deps only)
        run: pnpm audit --prod --audit-level=high

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}